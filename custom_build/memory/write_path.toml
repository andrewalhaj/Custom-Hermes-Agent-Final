# The write path's pattern filter for facts stored on purpose (ARCHITECTURE.md sections 3.3 and 3.6).
# A change here is a pull request with eval-set numbers from before and after (CONTRIBUTING.md rule C8).

# Characters, after surrounding whitespace is dropped.
min_length = 10

# Text that narrates instead of stating a fact: how the agent felt, or what it is about to do.
# Matched case-insensitively, anywhere in the text. The self-reference patterns come from the memory
# system this build replaces; the intent patterns are new.
narration = [
  '\bI (felt|feel|sensed|thought I|found myself|noticed myself|caught myself)\b',
  '\bI was (feeling|struggling|overwhelmed|panicking)\b',
  '\b(my own methodology|my instincts?|my gut)\b',
  '''^\s*(let me|let's|I will|I'll|I am going to|I'm going to|now I|next I)\b''',
]

# The supersede decision (section 3.3, step 4; defaults in 3.6), on the cosine similarity between a
# new fact and the nearest live fact of the same project.
[supersede]
without_judge = 0.92    # at or above, with both texts short, the new fact supersedes without asking
ask_judge_from = 0.80   # from here up, or at without_judge with a long text, the judge decides
judge_threshold = 0.75  # both of the judge's answers must reach it
short_text = 300        # characters; short is this many or fewer

# The judge's two questions about the pair, each answered with a probability (a TypeSafe Noul).
[supersede.questions.same_subject]
instructions = "Are `stored` and `new` about the same subject?"
criteria.true = "Both state something about the same thing: the same setting, machine, person, decision or preference."
criteria.false = "They are about different things, even where they share words."

[supersede.questions.supersedes]
instructions = "Does `new` replace what `stored` says, so that `stored` should no longer be relied on?"
criteria.true = "`new` updates, corrects or restates `stored`, so `stored` is out of date or redundant."
criteria.false = "`stored` stays true and useful beside `new`: `new` adds something else, or is about another thing."

# The gate on an extracted fact (section 3.3 step 3, #148): one request, two Nouls about the fact and the
# turn it came from (the user's message and the turn's tool results).
[gate]
drop_score = 0.70          # the judge gate (3.6), for extracted facts and digests: dropped when 1 - "worth keeping" is this or higher (#152)

[extraction]
support_threshold = 0.75   # the support check: kept only when "supported" is this or higher

[extraction.questions.worth_keeping]
instructions = "Is `fact` worth remembering in a later session with this user?"
criteria.true = "It states something lasting: a preference, a decision, a setting, or how one of the user's machines, projects or tools is set up."
criteria.false = "It is true only for this moment or this task, such as a passing error, a step in progress, or small talk."

[extraction.questions.supported]
instructions = "Does `source` state what `fact` says?"
criteria.true = "The user's message says it outright, or a tool result shows it directly, such as in a command's output or a file."
criteria.false = "`source` does not say it, only hints at it, or says something different."

# A session's digest (section 3.3, #155). A session is long, and gets one, at this many messages (3.6), not
# counting system prompts. Its gate is one Noul about the digest alone, dropped at the gate's drop score;
# a digest has no support check.
[digest]
long_session = 20

[digest.questions.worth_keeping]
instructions = "Is `digest` worth keeping as a record of this session for later sessions with this user?"
criteria.true = "It records decisions, changes, findings or open work that a later session could use."
criteria.false = "Nothing in it would help later: the session was small talk, or only repeated what is already known."

# The facts search (section 3.4; defaults in 3.6; #158). It lives here beside the write path's thresholds,
# so every 3.6 value the build reads is in one file.
[recall]
fusion_k = 20      # reciprocal-rank fusion constant for facts
pool_factor = 3    # the candidate pool is this many times the results wanted...
pool_min = 15      # ...and at least this many
results = 5        # results per message, and per memory_search call
results_past_work = 8   # on a question about past work or open work (3.5 points 3-4)
open_work_digests = 3   # a question about open work reads the newest this many digests (#158; a starting value)
digests_per_message = 1   # at most this many digests among a message's notes (decided on #158; a starting value)
deadline = 6       # seconds for recall in prefetch(), inside Hermes's 8-second limit

# What is embedded, and for how long a store waits (#238, decided 2026-11-17). On a CPU-only agent host the
# model needs about 3 s for 800 characters, so longer text could never finish in time; the abandoned request
# then held Ollama for every session. Recall keeps its 5 s (tool.TIMEOUT) and embeds only its query's first
# characters; the word search still reads the whole message. A stored text keeps its whole body.
[embed]
recall_chars = 1200   # about 3.6 s on the agent host
store_chars = 4000
store_timeout = 30   # seconds; storing is off the turn's path, but a digest at a compression is waited for

# The rerank (section 3.4 step 4, #165): the judge's probability that each recalled note helps answer the
# user's message, one Noul per candidate with the note's own text in its question ({note}), the message as
# state. A reranked note under the floor is dropped (3.6); notes ranked by fusion alone keep no floor.
[rerank]
floor = 0.30

[rerank.question]
instructions = "Does this note help answer the user's message in `message`? Note: {note}"
criteria.true = "The note gives something a reply to `message` needs or can use: a fact, a setting, a decision or past work on the same subject."
criteria.false = "The note is about a different machine, project or tool than `message` asks about, or shares words with `message` but would not change the reply."

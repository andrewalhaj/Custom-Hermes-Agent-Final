[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-hermes-agent"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.4",
    "pytest>=9.2",
    "pyyaml>=6.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
extend-select = ["BLE001", "S110"]
